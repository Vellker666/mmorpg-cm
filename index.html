<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMORPG Fantasy - Le Château de Poudlard</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; background: #000; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* UI Elements */
        #hud { position: absolute; top: 20px; left: 20px; color: #fff; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; }
        #hud h1 { margin: 0; font-size: 24px; color: #f39c12; letter-spacing: 1px; }
        #hud p { margin: 5px 0; font-size: 14px; color: #bdc3c7; }
        
        #controls-info { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: #fff; padding: 15px; border-radius: 8px; border: 1px solid #f39c12; font-size: 13px; max-width: 280px; z-index: 10; }
        #controls-info h3 { margin-top: 0; color: #f39c12; }
        #controls-info ul { padding-left: 20px; margin: 5px 0; }

        #chat-box { position: absolute; bottom: 20px; left: 20px; width: 350px; background: rgba(0, 0, 0, 0.75); border: 1px solid #f39c12; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; z-index: 10; }
        #chat-messages { height: 140px; overflow-y: auto; padding: 10px; color: #fff; font-size: 13px; }
        #chat-messages div { margin-bottom: 4px; }
        #chat-input-container { display: flex; border-top: 1px solid rgba(255,255,255,0.2); }
        #chat-input { flex: 1; background: transparent; border: none; padding: 10px; color: #fff; outline: none; }
        #chat-send { background: #f39c12; border: none; padding: 10px 15px; color: #000; font-weight: bold; cursor: pointer; }

        #notification { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(243, 156, 18, 0.9); color: #000; padding: 10px 20px; border-radius: 20px; font-weight: bold; display: none; z-index: 100; }
    </style>
    <!-- Three.js CDN Fix -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <h1>L'Académie Magique</h1>
        <p>Explorez le château colossal de Poudlard</p>
    </div>

    <div id="controls-info">
        <h3>Commandes</h3>
        <ul>
            <li><b>WASD / ZQSD</b> : Déplacements</li>
            <li><b>Clic + Glisser</b> : Tourner la caméra</li>
            <li><b>Majuscule</b> : Courir</li>
            <li><b>Espace</b> : Sauter</li>
            <li><b>Entrée</b> : Envoyer un message</li>
        </ul>
    </div>

    <div id="chat-box">
        <div id="chat-messages">
            <div><b style="color: #f39c12;">[Système]:</b> Bienvenue à l'Académie Magique !</div>
        </div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Discutez avec vos amis..." />
            <button id="chat-send">Envoyer</button>
        </div>
    </div>

    <div id="notification">Notification</div>

    <script style="display:none;">
        // Configuration Firebase (Insérez vos vraies clés lorsque vous publierez sur GitHub Pages)
        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "votre-projet.firebaseapp.com",
            databaseURL: "https://votre-projet-default-rtdb.firebaseio.com",
            projectId: "votre-projet",
            storageBucket: "votre-projet.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };
    </script>

    <script>
        // ==========================================
        // MOTEUR THREE.JS & MONDE 3D
        // ==========================================
        let scene, camera, renderer;
        let colliders = []; // Boîtes de collision rigides pour les murs et escaliers
        let player, playerBox;
        let keys = {};
        
        // Physique Joueur
        let playerVelocity = new THREE.Vector3();
        const GRAVITY = -30;
        const SPEED = 12;
        const RUN_SPEED = 22;
        let canJump = false;

        // Contrôles Caméra
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngles = { theta: 0, phi: 0.3 };

        // Synchronisation locale
        const localChannel = new BroadcastChannel('mmorpg_local_network');

        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111625);
            scene.fog = new THREE.FogExp2(0x111625, 0.003);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lumières
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 0.8);
            sunLight.position.set(100, 200, 100);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            // Terrains & Château Colossal
            createTerrain();
            createColossalCastle();

            // Joueur
            createPlayer();

            // Événements
            setupControls();
            setupChat();

            window.addEventListener('resize', onWindowResize);

            // Lancement de la boucle de jeu
            animate();
        }

        // ==========================================
        // MATÉRIAUX & ARCHITECTURE
        // ==========================================
        function createTerrain() {
            const groundGeo = new THREE.PlaneGeometry(1000, 1000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e5a27, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x5a5a66, roughness: 0.8 });
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x4a4a52, roughness: 0.8 });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x4a2e12, roughness: 0.7 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x1c2833, roughness: 0.5 });

        function createBoxCollider(x, y, z, w, h, d, material) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const box = new THREE.Box3().setFromObject(mesh);
            colliders.push(box);
            return mesh;
        }

        function createColossalCastle() {
            const cx = 0, cz = -100;
            const hallW = 80, hallH = 35, hallD = 120;

            // --- MURS EXTERIEURS DU CHÂTEAU ---
            createBoxCollider(cx - hallW/2, hallH/2, cz, 2, hallH, hallD, wallMat); // Gauche
            createBoxCollider(cx + hallW/2, hallH/2, cz, 2, hallH, hallD, wallMat); // Droit
            createBoxCollider(cx, hallH/2, cz - hallD/2, hallW, hallH, 2, wallMat); // Fond

            // Mur Façade (avec passage pour l'entrée)
            createBoxCollider(cx - 25, hallH/2, cz + hallD/2, 30, hallH, 2, wallMat);
            createBoxCollider(cx + 25, hallH/2, cz + hallD/2, 30, hallH, 2, wallMat);
            createBoxCollider(cx, hallH - 5, cz + hallD/2, 20, 10, 2, wallMat); // Arche haut

            // --- ÉTAGES INTERIEURS ---
            // Sol Rez-de-chaussée
            const floor0 = new THREE.Mesh(new THREE.BoxGeometry(hallW, 0.5, hallD), stoneMat);
            floor0.position.set(cx, 0.25, cz);
            scene.add(floor0);

            // 1er Étage (Plancher praticable)
            createBoxCollider(cx - 25, 12, cz, 28, 1, hallD - 20, stoneMat);
            createBoxCollider(cx + 25, 12, cz, 28, 1, hallD - 20, stoneMat);

            // 2ème Étage
            createBoxCollider(cx, 24, cz - 20, hallW - 10, 1, 60, stoneMat);

            // --- ESCALIERS SOLIDES ET PRATICABLES ---
            createStaircase(cx - 10, 0, cz + 30, 18, 12, 22);
            createStaircase(cx + 10, 12, cz - 10, 18, 12, 22);

            // --- TOURS D'ANGLE GIGANTESQUES ---
            const r = 14, h = 75;
            const towers = [
                { x: cx - hallW/2 - 5, z: cz - hallD/2 - 5 },
                { x: cx + hallW/2 + 5, z: cz - hallD/2 - 5 },
                { x: cx - hallW/2 - 5, z: cz + hallD/2 + 5 },
                { x: cx + hallW/2 + 5, z: cz + hallD/2 + 5 }
            ];

            towers.forEach(t => {
                const towerGeo = new THREE.CylinderGeometry(r, r, h, 16);
                const tower = new THREE.Mesh(towerGeo, stoneMat);
                tower.position.set(t.x, h/2, t.z);
                scene.add(tower);
                colliders.push(new THREE.Box3().setFromObject(tower));

                const roofGeo = new THREE.ConeGeometry(r + 2, 20, 16);
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.set(t.x, h + 10, t.z);
                scene.add(roof);
            });
        }

        function createStaircase(startX, startY, startZ, width, height, depth) {
            const steps = 12;
            const stepH = height / steps;
            const stepD = depth / steps;

            for (let i = 0; i < steps; i++) {
                const x = startX;
                const y = startY + (i * stepH) + (stepH / 2);
                const z = startZ - (i * stepD);
                createBoxCollider(x, y, z, width, stepH, stepD + 0.2, stoneMat);
            }
        }

        // ==========================================
        // JOUEUR ET DÉPLACEMENTS
        // ==========================================
        function createPlayer() {
            player = new THREE.Group();
            
            const bodyGeo = new THREE.CylinderGeometry(0.6, 0.8, 2.5, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.25;
            player.add(body);

            const headGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.7;
            player.add(head);

            player.position.set(0, 2, 50);
            scene.add(player);

            playerBox = new THREE.Box3();
        }

        function updatePlayer(delta) {
            const speed = (keys['ShiftLeft'] || keys['ShiftRight'] ? RUN_SPEED : SPEED) * delta;
            let moveDir = new THREE.Vector3(0, 0, 0);

            if (keys['KeyW'] || keys['ArrowUp']) moveDir.z -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) moveDir.z += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) moveDir.x -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) moveDir.x += 1;

            moveDir.normalize();

            if (moveDir.length() > 0) {
                const angle = Math.atan2(moveDir.x, moveDir.z) + cameraAngles.theta;
                player.rotation.y = angle;

                const moveX = Math.sin(angle) * speed;
                const moveZ = Math.cos(angle) * speed;

                // Test axe X
                player.position.x += moveX;
                updatePlayerBox();
                if (checkCollisions()) player.position.x -= moveX;

                // Test axe Z
                player.position.z += moveZ;
                updatePlayerBox();
                if (checkCollisions()) player.position.z -= moveZ;
            }

            // Gravité et montées des marches
            playerVelocity.y += GRAVITY * delta;
            player.position.y += playerVelocity.y * delta;
            updatePlayerBox();

            for (let box of colliders) {
                if (playerBox.intersectsBox(box)) {
                    if (playerVelocity.y < 0 && player.position.y >= box.max.y - 0.5) {
                        player.position.y = box.max.y;
                        playerVelocity.y = 0;
                        canJump = true;
                        break;
                    }
                }
            }

            if (player.position.y <= 0) {
                player.position.y = 0;
                playerVelocity.y = 0;
                canJump = true;
            }

            if (keys['Space'] && canJump) {
                playerVelocity.y = 12;
                canJump = false;
            }

            updateCamera();
        }

        function updatePlayerBox() {
            playerBox.setFromCenterAndSize(
                new THREE.Vector3(player.position.x, player.position.y + 1.5, player.position.z),
                new THREE.Vector3(1.2, 3.0, 1.2)
            );
        }

        function checkCollisions() {
            for (let box of colliders) {
                if (playerBox.intersectsBox(box)) {
                    if (player.position.y < box.max.y - 0.4) {
                        return true;
                    }
                }
            }
            return false;
        }

        function updateCamera() {
            const dist = 18;
            camera.position.x = player.position.x + dist * Math.sin(cameraAngles.theta) * Math.cos(cameraAngles.phi);
            camera.position.y = player.position.y + 3 + dist * Math.sin(cameraAngles.phi);
            camera.position.z = player.position.z + dist * Math.cos(cameraAngles.theta) * Math.cos(cameraAngles.phi);
            camera.lookAt(player.position.x, player.position.y + 2, player.position.z);
        }

        function setupControls() {
            window.addEventListener('keydown', e => {
                if (document.activeElement === document.getElementById('chat-input')) return;
                keys[e.code] = true;
            });
            window.addEventListener('keyup', e => { keys[e.code] = false; });

            window.addEventListener('mousedown', e => {
                if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
                    isDragging = true;
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                }
            });
            window.addEventListener('mouseup', () => isDragging = false);

            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                cameraAngles.theta -= deltaX * 0.005;
                cameraAngles.phi = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, cameraAngles.phi + deltaY * 0.005));

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
        }

        function setupChat() {
            const input = document.getElementById('chat-input');
            const btn = document.getElementById('chat-send');
            const messages = document.getElementById('chat-messages');

            function sendMessage() {
                const text = input.value.trim();
                if (!text) return;
                const msgDiv = document.createElement('div');
                msgDiv.innerHTML = `<b>Vous:</b> ${text}`;
                messages.appendChild(msgDiv);
                messages.scrollTop = messages.scrollHeight;
                localChannel.postMessage({ type: 'chat', text });
                input.value = '';
            }

            btn.addEventListener('click', sendMessage);
            input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

            localChannel.onmessage = e => {
                if (e.data.type === 'chat') {
                    const msgDiv = document.createElement('div');
                    msgDiv.innerHTML = `<b style="color:#3498db;">Ami:</b> ${e.data.text}`;
                    messages.appendChild(msgDiv);
                    messages.scrollTop = messages.scrollHeight;
                }
            };
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            updatePlayer(delta);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
